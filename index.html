                            <!-- Dons : en-tête (pastille « don », titre bilingue), puis coordonnées bancaires précédées du symbole de La Banque Postale -->
                            <section class="cover-donate">
                                <h3 class="cover-section-title">
                                    <span class="cover-section-logo cover-section-icon"
                                        ><svg class="icon"><use href="assets/icons/icon-donate.svg#icon"></use></svg
                                    ></span>
                                    <span class="cover-section-text">Soutenez votre mosquée<span class="tamil">உங்கள் பள்ளிவாசலை ஆதரியுங்கள்</span></span>
                                </h3>
                                <p class="cover-bank">
                                    <img src="assets/img/logo-lbp-mono.svg" alt="La Banque Postale" class="cover-bank-logo" />
                                    <span>IBAN&nbsp;: FR07 2004 1000 0140 0610 1N02 017<br />BIC&nbsp;: PSSTFRPPPAR</span>
                                </p>
                            </section>
                        </div>
                    </aside>
                    <section class="cover-months-zone">
                        <!-- En-tête : année grégorienne et années hégiriennes l'une sous l'autre, séparés des mois par un simple espace -->
                        <header class="cover-years">
                            <!-- Année en SVG (vectorielle dans le PDF) : « 20 » en bleu clair et « 27 » en bleu foncé (dégradés), motif girih en filigrane dans les
                                 chiffres ; le texte et la largeur sont posés par updateCover et fitCoverYear -->
                            <svg class="cover-year" aria-label="" role="img">
                                <defs>
                                    <linearGradient id="cover-year-grad" x1="0" y1="0" x2="0" y2="1">
                                        <stop class="cover-year-top" offset="0" />
                                        <stop class="cover-year-bottom" offset="1" />
                                    </linearGradient>
                                    <linearGradient id="cover-year-dark" x1="0" y1="0" x2="0" y2="1">
                                        <stop class="cover-year-dark-top" offset="0" />
                                        <stop class="cover-year-dark-bottom" offset="1" />
                                    </linearGradient>
                                    <pattern id="cover-year-girih" width="90" height="90" patternUnits="userSpaceOnUse" patternTransform="scale(0.42)">
                                        <rect class="cover-year-girih-tile" width="90" height="90" mask="url(#cover-girih-line)" />
                                    </pattern>
                                </defs>
                                <text class="cover-year-text"></text>
                                <text class="cover-year-text cover-year-motif" fill="url(#cover-year-girih)"></text>
                            </svg>
                            <div class="cover-hijri arabic"></div>
                        </header>
                        <div class="cover-months"></div>
                        <!-- Verset sur la prière à son heure (An-Nisāʾ, 4:103), sous les mois (deux lignes : français et tamoul, puis le numéro dans le symbole de fin de verset, entre deux grandes parenthèses ornées ; à droite, la référence en français et en tamoul), en traduction seulement : le texte
                             arabe du Coran n'est pas imprimé sur un support destiné à être jeté -->
                        <figure class="cover-verse">
                            <blockquote class="cover-verse-quote">
                                <span class="cover-verse-mark arabic">﴾</span>
                                <div class="cover-verse-text">
                                    <p class="cover-verse-fr">La prière est, pour les croyants, une prescription à des temps déterminés.</p>
                                    <p class="cover-verse-ta tamil">நிச்சயமாக தொழுகை முஃமின்கள் மீது நேரம் குறிக்கப்பட்ட கடமையாக இருக்கிறது.</p>
                                </div>
                                <span class="cover-verse-ayah arabic" title="verset 103">&#x06DD;١٠٣</span>
                                <span class="cover-verse-mark arabic">﴿</span>
                            </blockquote>
                            <figcaption class="cover-verse-refs">
                                <cite>Coran 4:103</cite>
                                <cite class="tamil">குர்ஆன் 4:103</cite>
                            </figcaption>
                        </figure>
                    </section>
                </div>
            </div>
        </template>

        <template id="calendar-cell-template">
            <div class="day-cell-visual">

                    ><svg class="icon"><use href="assets/icons/icon-moon.svg#icon"></use></svg
                ></span>
                <span class="dst-icon" hidden></span>
                <div class="event-label" hidden></div>

        <!-- Template pour une ligne du tableau des prières (Optimisation JS) -->
        <template id="prayer-row-template">
            <tr>
                <td class="col-date-greg">

                <td class="fajr"></td>
                <td class="sunrise"></td>

                <td class="asr"></td>
                <td class="maghrib"></td>
                <td class="isha"></td>
                <td class="col-hijri"></td>

        </template>
    </body>
