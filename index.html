<!doctype html>
<html lang="fr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=1160" />
        <!-- page A4 paysage (297 mm) + marges : sur smartphone, la page entière tient dans l'écran (zoom possible) -->
        <title>Calendrier AMI - La Courneuve</title>
        <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
        <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
        <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
        <link rel="manifest" href="site.webmanifest" />

        <!-- Performance : Pré-chargement de la police principale -->
        <link rel="preload" href="assets/fonts/NotoSans-Regular.ttf" as="font" type="font/ttf" crossorigin />

        <!-- Feuilles de styles (chargement parallèle) -->
        <link rel="stylesheet" href="css/fonts.css" />
        <link rel="stylesheet" href="css/variables.css" />
        <link rel="stylesheet" href="css/base.css" />
        <link rel="stylesheet" href="css/header.css" />
        <link rel="stylesheet" href="css/calendar.css" />
        <link rel="stylesheet" href="css/table.css" />
        <link rel="stylesheet" href="css/cover.css" />
        <!-- media="print" permet de ne pas bloquer le rendu écran -->
        <link rel="stylesheet" href="css/print.css" media="print" />

        <!-- Scripts JS : Chargés avec 'defer' pour ne pas bloquer l'analyse du HTML -->
        <script src="js/lib/adhan.min.js" defer></script>

        <script src="data/config.js" defer></script>
        <script src="data/lang.js" defer></script>
        <script src="js/main.js" type="module" defer></script>
    </head>

    <body>
        <!-- Conteneur principal de l'application -->
        <!-- Frises du header : torsade de deux brins fins entrelacés (dessus/dessous alternés à chaque croisement),
             motif vectoriel répété au pas de 8 px par js/main.js -->
        <svg width="0" height="0" style="position: absolute" aria-hidden="true">
            <defs>
                <clipPath id="torsade-croisement-milieu"><rect x="3" y="-1" width="2" height="7" /></clipPath>
                <clipPath id="torsade-croisement-bords">
                    <rect x="-1" y="-1" width="2" height="7" />
                    <rect x="7" y="-1" width="2" height="7" />
                </clipPath>
                <symbol id="torsade-saffron" overflow="visible">
                    <path d="M0 2.25 C1.2 0.6 2.8 0.6 4 2.25 C5.2 3.9 6.8 3.9 8 2.25" fill="none" stroke="currentColor" stroke-width="0.7" stroke-linecap="round" />
                    <path d="M0 2.25 C1.2 3.9 2.8 3.9 4 2.25 C5.2 0.6 6.8 0.6 8 2.25" fill="none" stroke="currentColor" stroke-width="0.7" stroke-linecap="round" />
                    <g clip-path="url(#torsade-croisement-milieu)">
                        <path d="M0 2.25 C1.2 0.6 2.8 0.6 4 2.25 C5.2 3.9 6.8 3.9 8 2.25" fill="none" stroke="white" stroke-width="1.7" />
                        <path d="M0 2.25 C1.2 0.6 2.8 0.6 4 2.25 C5.2 3.9 6.8 3.9 8 2.25" fill="none" stroke="currentColor" stroke-width="0.7" stroke-linecap="round" />
                    </g>
                    <g clip-path="url(#torsade-croisement-bords)">
                        <path d="M0 2.25 C1.2 3.9 2.8 3.9 4 2.25 C5.2 0.6 6.8 0.6 8 2.25" fill="none" stroke="white" stroke-width="1.7" />
                        <path d="M0 2.25 C1.2 3.9 2.8 3.9 4 2.25 C5.2 0.6 6.8 0.6 8 2.25" fill="none" stroke="currentColor" stroke-width="0.7" stroke-linecap="round" />
                    </g>
                </symbol>
                <symbol id="torsade-green" overflow="visible">
                    <path d="M0 2.25 C1.2 0.6 2.8 0.6 4 2.25 C5.2 3.9 6.8 3.9 8 2.25" fill="none" stroke="currentColor" stroke-width="0.7" stroke-linecap="round" />
                    <path d="M0 2.25 C1.2 3.9 2.8 3.9 4 2.25 C5.2 0.6 6.8 0.6 8 2.25" fill="none" stroke="currentColor" stroke-width="0.7" stroke-linecap="round" />
                    <g clip-path="url(#torsade-croisement-milieu)">
                        <path d="M0 2.25 C1.2 0.6 2.8 0.6 4 2.25 C5.2 3.9 6.8 3.9 8 2.25" fill="none" stroke="white" stroke-width="1.7" />
                        <path d="M0 2.25 C1.2 0.6 2.8 0.6 4 2.25 C5.2 3.9 6.8 3.9 8 2.25" fill="none" stroke="currentColor" stroke-width="0.7" stroke-linecap="round" />
                    </g>
                    <g clip-path="url(#torsade-croisement-bords)">
                        <path d="M0 2.25 C1.2 3.9 2.8 3.9 4 2.25 C5.2 0.6 6.8 0.6 8 2.25" fill="none" stroke="white" stroke-width="1.7" />
                        <path d="M0 2.25 C1.2 3.9 2.8 3.9 4 2.25 C5.2 0.6 6.8 0.6 8 2.25" fill="none" stroke="currentColor" stroke-width="0.7" stroke-linecap="round" />
                    </g>
                </symbol>
            </defs>
        </svg>
        <div id="app"></div>

        <!-- Template de la page (cloné par JS) -->
        <template id="page-template">
            <div class="page A4-landscape">
                <!-- EN-TÊTE : logo et noms empilés (tamoul, français) à gauche | coordonnées en 2 colonnes à droite -->
                <header class="header-fixed">
                    <svg class="frise frise-top" data-maillon="torsade-saffron" aria-hidden="true"></svg>
                    <svg class="frise frise-bottom" data-maillon="torsade-green" aria-hidden="true"></svg>
                    <div class="header-content">
                        <div class="logo-box">
                            <img src="assets/img/AMI.png" alt="Logo de l'Association Musulmane de l'Inde" class="logo-img" />
                        </div>
                        <div class="header-main">
                            <div class="org-names">
                                <h1 class="org-ta tamil">இந்திய முஸ்லிம் சங்கம்</h1>
                                <h2 class="org-fr">ASSOCIATION MUSULMANE DE L'INDE</h2>
                            </div>
                            <div class="header-contacts">
                                <div class="info-line">
                                    <svg class="icon"><use href="assets/icons/icon-mosque.svg#icon"></use></svg> <span>91-93 BOULEVARD PASTEUR, 93120 LA COURNEUVE</span>
                                </div>
                                <div class="info-line">
                                    <span class="info-item"
                                        ><svg class="icon"><use href="assets/icons/icon-phone.svg#icon"></use></svg> <span>01.48.36.48.66</span></span
                                    ><span class="info-item"
                                        ><svg class="icon"><use href="assets/icons/icon-whatsapp.svg#icon"></use></svg> <span>07.86.14.66.55</span></span
                                    >
                                </div>
                                <div class="info-line">
                                    <svg class="icon"><use href="assets/icons/icon-office.svg#icon"></use></svg> <span>7-8 PLACE ALFRED DE MUSSET, 93120 LA COURNEUVE</span>
                                </div>
                                <div class="info-line">
                                    <span class="info-item"
                                        ><svg class="icon"><use href="assets/icons/icon-email.svg#icon"></use></svg> <span>ami93120@gmail.com</span></span
                                    ><span class="info-item"
                                        ><svg class="icon"><use href="assets/icons/icon-website.svg#icon"></use></svg> <span>ami93.com</span></span
                                    >
                                </div>
                                <div class="info-line info-wide">
                                    <svg class="icon"><use href="assets/icons/icon-bank.svg#icon"></use></svg>
                                    <span>IBAN&nbsp;: FR07 2004 1000 0140 0610 1N02 017 • BIC&nbsp;: PSSTFRPPPAR</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </header>

                <!-- CONTENU PRINCIPAL : Grille Calendrier + Tableau Prières -->
                <main class="main-split-container">
                    <!-- SECTION GAUCHE : Calendrier Visuel -->
                    <section class="left-visual-calendar">
                        <!-- Titre du mois : grégorien (gauche) | hégirien (droite), dans l'en-tête de la carte -->
                        <section class="month-titles-zone">
                            <div class="titles-gregorian">
                                <div class="title-main"><span class="greg-month-fr"></span> <span class="year-display"></span></div>
                                <div class="title-sub">
                                    <span class="greg-month-ta tamil"></span>
                                </div>
                            </div>
                            <div class="titles-hijri">
                                <div class="title-main hijri-month-ar arabic dir-rtl"></div>
                                <div class="title-sub">
                                    <span class="hijri-month-ta tamil"></span>
                                    <span class="hijri-month-fr"></span>
                                </div>
                            </div>
                        </section>
                        <div class="weekdays-header" id="weekdays-header">
                            <div class="weekday-cell">
                                <div class="weekday-fr">Lundi</div>
                                <div class="arabic weekday-sub">الإثنين</div>
                                <div class="tamil weekday-sub">திங்கள்</div>
                            </div>
                            <div class="weekday-cell">
                                <div class="weekday-fr">Mardi</div>
                                <div class="arabic weekday-sub">الثلاثاء</div>
                                <div class="tamil weekday-sub">செவ்வாய்</div>
                            </div>
                            <div class="weekday-cell">
                                <div class="weekday-fr">Mercredi</div>
                                <div class="arabic weekday-sub">الأربعاء</div>
                                <div class="tamil weekday-sub">புதன்</div>
                            </div>
                            <div class="weekday-cell">
                                <div class="weekday-fr">Jeudi</div>
                                <div class="arabic weekday-sub">الخميس</div>
                                <div class="tamil weekday-sub">வியாழன்</div>
                            </div>
                            <div class="weekday-cell">
                                <div class="weekday-fr">Vendredi</div>
                                <div class="arabic weekday-sub">الجمعة</div>
                                <div class="tamil weekday-sub">வெள்ளி</div>
                            </div>
                            <div class="weekday-cell">
                                <div class="weekday-fr">Samedi</div>
                                <div class="arabic weekday-sub">السبت</div>
                                <div class="tamil weekday-sub">சனி</div>
                            </div>
                            <div class="weekday-cell">
                                <div class="weekday-fr">Dimanche</div>
                                <div class="arabic weekday-sub">الأحد</div>
                                <div class="tamil weekday-sub">ஞாயிறு</div>
                            </div>
                        </div>
                        <ami-calendar-grid></ami-calendar-grid>
                        <!-- Bande du bas : légende des événements du mois (jours vertueux, vacances, changement d'heure), remplie par js/main.js -->
                        <div class="legend-box"></div>
                    </section>

                    <!-- SECTION DROITE : Tableau des Horaires -->
                    <section class="right-prayer-table-container">
                        <ami-prayer-table>
                            <table class="prayer-table" id="prayer-table">
                                <thead>
                                    <tr>
                                        <th>
                                            <div class="th-stack">
                                                <p class="th-fr">Date</p>
                                                <p class="th-ar arabic">التاريخ</p>
                                                <p class="th-ta tamil">தேதி</p>
                                            </div>
                                        </th>
                                        <th>
                                            <div class="th-stack">
                                                <p class="th-fr">Fajr</p>
                                                <p class="th-ar arabic">الفجر</p>
                                                <p class="th-ta tamil">ஃபஜ்ர்</p>
                                            </div>
                                        </th>
                                        <th>
                                            <div class="th-stack">
                                                <p class="th-fr">Shuruq</p>
                                                <p class="th-ar arabic">الشروق</p>
                                                <p class="th-ta tamil">ஷுரூக்</p>
                                            </div>
                                        </th>
                                        <th>
                                            <div class="th-stack">
                                                <p class="th-fr">Dhohr</p>
                                                <p class="th-ar arabic">الظهر</p>
                                                <p class="th-ta tamil">லுஹர்</p>
                                            </div>
                                        </th>
                                        <th>
                                            <div class="th-stack">
                                                <p class="th-fr">Asr</p>
                                                <p class="th-ar arabic">العصر</p>
                                                <p class="th-ta tamil">அஸர்</p>
                                            </div>
                                        </th>
                                        <th>
                                            <div class="th-stack">
                                                <p class="th-fr">Maghrib</p>
                                                <p class="th-ar arabic">المغرب</p>
                                                <p class="th-ta tamil">மஃரிப்</p>
                                            </div>
                                        </th>
                                        <th>
                                            <div class="th-stack">
                                                <p class="th-fr">Icha</p>
                                                <p class="th-ar arabic">العشاء</p>
                                                <p class="th-ta tamil">இஷா</p>
                                            </div>
                                        </th>
                                        <th>
                                            <div class="th-header-symbol">
                                                <svg class="icon"><use href="assets/icons/icon-moon.svg#icon"></use></svg>
                                            </div>
                                        </th>
                                    </tr>
                                </thead>
                                <tbody></tbody>
                            </table>
                        </ami-prayer-table>
                    </section>
                </main>
            </div>
        </template>

        <!-- Template pour une cellule du calendrier (Optimisation JS) -->
        <!-- Page de couverture : colonne logo, années, Mawaqit et coordonnées | aperçu des 12 mois (3 × 4) sur toute la hauteur -->
        <template id="cover-template">
            <div class="page A4-landscape cover-page">
                <div class="cover-body">
                    <aside class="cover-identity">
                        <img src="assets/img/AMI.png" alt="Logo de l'Association Musulmane de l'Inde" class="cover-logo logo-img" />
                        <div class="cover-ornament" aria-hidden="true"><span></span></div>
                        <div class="cover-years">
                            <div class="cover-year"></div>
                            <div class="cover-hijri arabic dir-rtl"></div>
                        </div>
                        <p class="cover-sources">Horaires de la Grande Mosquée de Paris • Dates hégiriennes calculées,<br />à un jour près selon l'observation du croissant</p>
                        <!-- Pied de colonne : titre Mawaqit commun, un QR code par lieu (nom et adresse), puis contacts et dons -->
                        <footer class="cover-footer">
                            <div class="cover-footer-title">Horaires et annonces sur Mawaqit</div>
                            <figure class="cover-qr">
                                <div class="cover-qr-code">
                                    <img src="assets/img/qr-mawaqit-pasteur.svg" alt="QR code Mawaqit de la Mosquée AMI, boulevard Pasteur" />
                                    <img class="cover-qr-logo" src="assets/img/mawaqit-icon.png" alt="" />
                                </div>
                                <figcaption>
                                    <span class="cover-qr-name"
                                        ><svg class="icon"><use href="assets/icons/icon-mosque.svg#icon"></use></svg> Mosquée</span
                                    >
                                    <span class="cover-qr-addr">91-93 boulevard Pasteur<br />93120 La Courneuve</span>
                                </figcaption>
                            </figure>
                            <figure class="cover-qr">
                                <div class="cover-qr-code">
                                    <img src="assets/img/qr-mawaqit-musset.svg" alt="QR code Mawaqit de la Salle de prière AMI, place Alfred de Musset" />
                                    <img class="cover-qr-logo" src="assets/img/mawaqit-icon.png" alt="" />
                                </div>
                                <figcaption>
                                    <span class="cover-qr-name"
                                        ><svg class="icon"><use href="assets/icons/icon-office.svg#icon"></use></svg> Salle de prière</span
                                    >
                                    <span class="cover-qr-addr">7-8 place Alfred de Musset<br />93120 La Courneuve</span>
                                </figcaption>
                            </figure>
                            <div class="cover-contacts">
                                <div class="cover-contacts-row">
                                    <span
                                        ><svg class="icon"><use href="assets/icons/icon-phone.svg#icon"></use></svg> 01.48.36.48.66</span
                                    ><span
                                        ><svg class="icon"><use href="assets/icons/icon-whatsapp.svg#icon"></use></svg> 07.86.14.66.55</span
                                    >
                                </div>
                                <div class="cover-contacts-row">
                                    <span
                                        ><svg class="icon"><use href="assets/icons/icon-email.svg#icon"></use></svg> ami93120@gmail.com</span
                                    ><span
                                        ><svg class="icon"><use href="assets/icons/icon-website.svg#icon"></use></svg> ami93.com</span
                                    >
                                </div>
                                <div class="cover-contacts-row cover-bank">
                                    <span
                                        ><svg class="icon"><use href="assets/icons/icon-bank.svg#icon"></use></svg> IBAN&nbsp;: FR07 2004 1000 0140 0610 1N02 017</span
                                    >
                                </div>
                                <div class="cover-contacts-row cover-bank cover-bic"><span>BIC&nbsp;: PSSTFRPPPAR</span></div>
                            </div>
                        </footer>
                    </aside>
                    <section class="cover-months-zone">
                        <div class="cover-months"></div>
                        <div class="cover-legend">
                            <span class="cover-legend-item"><span class="swatch swatch-holiday"></span>Vacances scolaires (zone C)</span>
                            <span class="cover-legend-item"><span class="swatch swatch-ramadan"></span>Début du Ramadan</span>
                            <span class="cover-legend-item"><span class="swatch swatch-eid"></span>Aïd</span>
                            <span class="cover-legend-item"><span class="swatch swatch-public"></span>Jour férié</span>
                        </div>
                    </section>
                </div>
            </div>
        </template>

        <template id="calendar-cell-template">
            <div class="day-cell-visual">
                <span class="vis-greg"></span>
                <span class="vis-hij"></span>
                <span class="new-moon-icon" hidden
                    ><svg class="icon"><use href="assets/icons/icon-moon.svg#icon"></use></svg
                ></span>
                <span class="dst-icon" hidden></span>
                <div class="event-label" hidden></div>
            </div>
        </template>

        <!-- Template pour une ligne du tableau des prières (Optimisation JS) -->
        <template id="prayer-row-template">
            <tr>
                <td class="col-date-greg">
                    <div class="date-cell">
                        <div class="day-name"></div>
                        <div class="day-num"></div>
                    </div>
                </td>
                <td class="fajr"></td>
                <td class="sunrise"></td>
                <td class="dhuhr"></td>
                <td class="asr"></td>
                <td class="maghrib"></td>
                <td class="isha"></td>
                <td class="col-hijri"></td>
            </tr>
        </template>
    </body>
</html>
